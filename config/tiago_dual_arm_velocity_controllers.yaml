controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    arm_left_velocity_controller:
      type: tiago_arm_velocity_controller/TiagoArmVelocityPositionController

    arm_right_velocity_controller:
      type: tiago_arm_velocity_controller/TiagoArmVelocityPositionController

arm_left_velocity_controller:
  ros__parameters:
    joints:
      - arm_left_1_joint
      - arm_left_2_joint
      - arm_left_3_joint
      - arm_left_4_joint
      - arm_left_5_joint
      - arm_left_6_joint
      - arm_left_7_joint
    cmd_timeout_seconds: 0.2

arm_right_velocity_controller:
  ros__parameters:
    joints:
      - arm_right_1_joint
      - arm_right_2_joint
      - arm_right_3_joint
      - arm_right_4_joint
      - arm_right_5_joint
      - arm_right_6_joint
      - arm_right_7_joint
    cmd_timeout_seconds: 0.2